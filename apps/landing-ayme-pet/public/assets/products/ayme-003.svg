      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#D97706" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
