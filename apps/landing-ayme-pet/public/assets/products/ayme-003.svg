    <path d="M250,270 L250,480" stroke="#FEF3C7" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M350,270 L350,480" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
