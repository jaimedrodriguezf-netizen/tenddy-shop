<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="petGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#DBEAFE" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#BFDBFE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fondo Técnico con Cuadrícula Milimétrica sutil -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  </pattern>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Stamp Técnico Superior -->
  <rect x="25" y="25" width="230" height="48" rx="6" fill="#1E293B" opacity="0.95"/>
  <text x="38" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">PLANO TÉCNICO • AYME-001</text>
  <text x="38" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">BOTELLA CILÍNDRICA 500 ML</text>

  <!-- Botella PET 3D Vectorial -->
  <g filter="url(#shadow)">
    <!-- Base petaloide -->
    <path d="M220,490 Q220,510 240,515 L360,515 Q380,510 380,490 L380,240 Q380,210 330,175 L330,125 L340,125 L340,110 L330,110 L330,85 L270,85 L270,110 L260,110 L260,125 L270,125 L270,175 Q220,210 220,240 Z" fill="url(#petGlass)" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Brillos y Reflejos -->
    <path d="M240,240 L240,490" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M250,240 L250,490" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M360,240 L360,490" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Nervaduras de Refuerzo -->
    <ellipse cx="300" cy="270" rx="76" ry="6" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3,3"/>
    <ellipse cx="300" cy="460" rx="76" ry="6" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- COTAS Y MEDIDAS DE INGENIERÍA -->
  
  <!-- COTA 1: ALTURA TOTAL (205 mm) -->
  <g stroke="#A61C2E" stroke-width="1.5" fill="#A61C2E">
    <!-- Líneas de extensión -->
    <line x1="335" y1="85" x2="480" y2="85" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="370" y1="515" x2="480" y2="515" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Línea de cota con flechas -->
    <line x1="470" y1="95" x2="470" y2="505"/>
    <polygon points="470,85 466,97 474,97"/>
    <polygon points="470,515 466,503 474,503"/>
    <!-- Etiqueta de Cota -->
    <rect x="425" y="280" width="90" height="34" rx="6" fill="#A61C2E"/>
    <text x="470" y="296" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FED7AA" text-anchor="middle">ALTURA TOTAL</text>
    <text x="470" y="309" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">205.0 mm</text>
  </g>

  <!-- COTA 2: DIÁMETRO DEL CUERPO (Ø 64.2 mm) -->
  <g stroke="#1F2E4D" stroke-width="1.5" fill="#1F2E4D">
    <line x1="220" y1="520" x2="220" y2="570" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="380" y1="520" x2="380" y2="570" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="230" y1="555" x2="370" y2="555"/>
    <polygon points="220,555 232,551 232,559"/>
    <polygon points="380,555 368,551 368,559"/>
    <rect x="250" y="540" width="100" height="28" rx="4" fill="#1F2E4D"/>
    <text x="300" y="558" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ø 64.2 mm</text>
  </g>

  <!-- COTA 3: BOCA / ROSCA (28 mm PCO 1881) -->
  <g stroke="#0284C7" stroke-width="1.5" fill="#0284C7">
    <line x1="270" y1="80" x2="270" y2="40" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="330" y1="80" x2="330" y2="40" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="275" y1="50" x2="325" y2="50"/>
    <polygon points="270,50 278,47 278,53"/>
    <polygon points="330,50 322,47 322,53"/>
    <rect x="345" y="36" width="125" height="28" rx="4" fill="#0284C7"/>
    <text x="407" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">BOCA: 28 mm PCO</text>
  </g>

  <!-- Badge de Gramaje y Capacidad Inferior Izquierdo -->
  <g>
    <rect x="25" y="525" width="145" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="35" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">PESO / GRAMAJE:</text>
    <text x="35" y="563" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#A61C2E">21.0 g ± 0.5g</text>
  </g>
</svg>