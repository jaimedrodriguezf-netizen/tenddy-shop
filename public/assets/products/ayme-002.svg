<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="bostonGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#F1F5F9" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#E2E8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad2)"/>
  <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  </pattern>
  <rect width="600" height="600" fill="url(#grid2)"/>

  <!-- Stamp Técnico -->
  <rect x="25" y="25" width="230" height="48" rx="6" fill="#1E293B" opacity="0.95"/>
  <text x="38" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">PLANO TÉCNICO • AYME-002</text>
  <text x="38" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">BOSTON ROUND 250 ML</text>

  <!-- Botella Boston Round 3D -->
  <g filter="url(#shadow2)">
    <path d="M230,490 Q230,510 250,510 L350,510 Q370,510 370,490 L370,250 C370,200 325,180 325,140 L325,115 L330,115 L330,95 L270,95 L270,115 L275,115 L275,140 C275,180 230,200 230,250 Z" fill="url(#bostonGlass)" stroke="#64748B" stroke-width="1.5"/>
    <path d="M245,250 L245,490" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M355,250 L355,490" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- COTAS Y MEDIDAS -->
  <!-- ALTURA 152 mm -->
  <g stroke="#A61C2E" stroke-width="1.5" fill="#A61C2E">
    <line x1="335" y1="95" x2="480" y2="95" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="365" y1="510" x2="480" y2="510" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="470" y1="105" x2="470" y2="500"/>
    <polygon points="470,95 466,107 474,107"/>
    <polygon points="470,510 466,498 474,498"/>
    <rect x="425" y="280" width="90" height="34" rx="6" fill="#A61C2E"/>
    <text x="470" y="296" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FED7AA" text-anchor="middle">ALTURA TOTAL</text>
    <text x="470" y="309" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">152.0 mm</text>
  </g>

  <!-- DIÁMETRO Ø 56 mm -->
  <g stroke="#1F2E4D" stroke-width="1.5" fill="#1F2E4D">
    <line x1="230" y1="515" x2="230" y2="565" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="370" y1="515" x2="370" y2="565" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="550" x2="360" y2="550"/>
    <polygon points="230,550 242,546 242,554"/>
    <polygon points="370,550 358,546 358,554"/>
    <rect x="250" y="535" width="100" height="28" rx="4" fill="#1F2E4D"/>
    <text x="300" y="553" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ø 56.0 mm</text>
  </g>

  <!-- BOCA: 24/410 mm -->
  <g stroke="#0284C7" stroke-width="1.5" fill="#0284C7">
    <line x1="270" y1="90" x2="270" y2="50" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="330" y1="90" x2="330" y2="50" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="275" y1="60" x2="325" y2="60"/>
    <polygon points="270,60 278,57 278,63"/>
    <polygon points="330,60 322,57 322,63"/>
    <rect x="345" y="46" width="135" height="28" rx="4" fill="#0284C7"/>
    <text x="412" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">BOCA: 24/410 mm</text>
  </g>

  <g>
    <rect x="25" y="525" width="145" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="35" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">PESO / GRAMAJE:</text>
    <text x="35" y="563" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#A61C2E">24.0 g ± 0.5g</text>
  </g>
</svg>